<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一颗岛</title>
<style>
:root{
  color-scheme:light;
  --page:#eceef2; --panel:#fbfbfc; --line:rgba(0,0,0,.1); --ink:#1d1d1f; --muted:#5f6068; --faint:#6e6f76;
  --accent:#0058cc; --ok:#0e6436; --ok-soft:rgba(23,134,74,.12);
  --wall:radial-gradient(90% 70% at 12% 8%,#9cc9ff 0%,transparent 62%),radial-gradient(80% 70% at 92% 18%,#b9b3ff 0%,transparent 60%),linear-gradient(160deg,#cfe3ff,#8fb4ef);
  --menu:#101114; --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#121316; --panel:#1b1c20; --line:rgba(255,255,255,.12); --ink:#f2f2f5; --muted:#a4a5ad; --faint:#8e8f97;
  --accent:#5a9cff; --ok:#4cc38a; --ok-soft:rgba(76,195,138,.16);
  --wall:linear-gradient(160deg,#10192e,#0b1222); --menu:#f4f5f8;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 var(--sans);padding:28px 16px 64px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 8px}
.lede{color:var(--muted);max-width:68ch;margin:0 0 18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
button{font:inherit;color:inherit;background:var(--panel);border:0;border-radius:9px;padding:6px 12px;box-shadow:inset 0 0 0 .5px var(--line);cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.stage{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--wall);box-shadow:0 0 0 .5px var(--line)}
.menu{position:absolute;inset:0 0 auto;height:28px;display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--menu)}
.island,.companion{position:absolute;top:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;overflow:hidden;pointer-events:none}
.island{left:50%;height:28px;border-radius:0 0 14px 14px;transform:translateX(-50%)}
.island.pill{border-radius:14px;top:4px;height:22px}
.ear{font-size:12px;font-weight:600;white-space:nowrap;padding:0 10px;opacity:0}
.ear b{font-weight:650}
.dot{width:6px;height:6px;border-radius:50%;background:#0a84ff;position:absolute;right:8px;bottom:6px;opacity:0}
.companion{height:28px;border-radius:14px;font-size:12px;font-weight:600;padding:0 12px;opacity:0;justify-content:center}
.card{margin-top:14px;background:var(--panel);border-radius:14px;padding:14px 16px;box-shadow:inset 0 0 0 .5px var(--line)}
.card h2{font-size:13px;margin:0 0 6px}
.card p{margin:0;color:var(--muted);font-size:14px}
.token{font-family:var(--mono);font-size:12px;color:var(--accent)}
.note{margin-top:10px;font-size:13px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <h1>一颗岛</h1>
  <p class="lede">对 Alcove 的那一张画面。还是五种呈现、一颗纯黑的岛，弹簧只用已经有的令牌。紧凑的左右耳是正在进行的那一件，展开是它放大；两件要同时露面时分开，再合并；音量和亮度也长在这颗岛上。不画假刘海，界面不叫灵动岛。</p>
  <div class="row" role="group" aria-label="看哪一段">
    <button type="button" data-scene="ears" aria-pressed="true">紧凑两耳</button>
    <button type="button" data-scene="split">分开再合并</button>
    <button type="button" data-scene="level">音量</button>
    <button type="button" data-scene="content">内容跟着形状</button>
    <label class="sw"><input id="reduced" type="checkbox"> 减少动态效果</label>
  </div>
  <div class="stage" id="stage">
    <div class="menu">音乐</div>
    <div class="island" id="island">
      <span class="ear" id="lead"></span>
      <span class="ear" id="trail"></span>
      <i class="dot" id="dot"></i>
    </div>
    <div class="companion" id="companion">构建完成</div>
  </div>
  <div class="card">
    <h2 id="title">紧凑就是活动本身</h2>
    <p id="copy">左耳是谁，右耳是进度。点舞台，展开成同一件事；再点，沿 calm 收回。窗口还收着的时候，只留一个点。</p>
    <p class="note">这一下的弹簧：<span class="token" id="token">expand</span></p>
  </div>
</div>
<script>
const tokens = {
  calm: { response: 0.34, zeta: 1 },
  expand: { response: 0.40, zeta: 0.92 },
  bloom: { response: 0.42, zeta: 0.84 },
  pop: { response: 0.30, zeta: 0.75 },
  reduced: { response: 0.25, zeta: 1 }
};
const island = document.getElementById('island');
const lead = document.getElementById('lead');
const trail = document.getElementById('trail');
const dot = document.getElementById('dot');
const companion = document.getElementById('companion');
const title = document.getElementById('title');
const copy = document.getElementById('copy');
const tokenEl = document.getElementById('token');
const reducedBox = document.getElementById('reduced');
let scene = 'ears';
let open = false;
let split = 0;
let level = 0.4;
let levelHold = 0;
let contentIn = 0;
let shape = { w: 168, h: 28, v: 0, hv: 0 };
let comp = { x: 0, o: 0, v: 0 };
let last = performance.now();
const scenes = {
  ears: ['紧凑就是活动本身', '左耳是曲名，右耳是进度。点舞台展开，再点沿 calm 收回。收着的窗口只留一个点，不跟播放抢两耳。', 'expand'],
  split: ['分开，再合并', '正在播放，标题又变了：一颗岛分成两颗。再点，从现在的位置沿 expand 合成回去。半路改方向不跳回起点。', 'expand'],
  level: ['音量和亮度', '按 ↑ / ↓ 把音量鼓在同一颗岛上，连按留住，停手后沿 calm 收回。这是交互，不是第二扇窗。', 'pop'],
  content: ['内容跟着形状', '形状先长。走到四成，字才淡入。减少动态效果时位置不动，只淡入淡出，弹簧换成 reduced。', 'bloom']
};
function springTo(current, velocity, target, name, dt) {
  const token = reducedBox.checked ? tokens.reduced : tokens[name];
  const k = Math.pow(2 * Math.PI / token.response, 2);
  const c = 4 * Math.PI * token.zeta / token.response;
  const force = -k * (current - target) - c * velocity;
  velocity += force * dt;
  current += velocity * dt;
  return [current, velocity];
}
function render() {
  const stage = document.getElementById('stage');
  const mid = stage.clientWidth / 2;
  if (reducedBox.checked && scene !== 'content') {
    island.style.transition = 'none';
  }
  island.style.width = shape.w + 'px';
  island.style.height = Math.max(22, shape.h) + 'px';
  island.classList.toggle('pill', scene === 'level' || scene === 'content');
  const show = reducedBox.checked ? (contentIn > 0.5 || scene === 'ears' || scene === 'split' || scene === 'level') : contentIn;
  lead.style.opacity = trail.style.opacity = show;
  lead.innerHTML = scene === 'level' ? '音量' : (open ? 'September · Earth, Wind & Fire' : 'September');
  trail.innerHTML = scene === 'level' ? '<b>' + Math.round(level * 100) + '</b>' : (open ? '正在播放' : '<b>40%</b>');
  dot.style.opacity = scene === 'ears' || scene === 'split' ? 1 : 0;
  const gap = reducedBox.checked ? (split > 0.5 ? 1 : 0) : split;
  companion.style.opacity = reducedBox.checked ? gap : comp.o;
  companion.style.width = (110 * Math.max(gap, 0.2)) + 'px';
  companion.style.left = (mid + shape.w / 2 + 8 * gap + comp.x) + 'px';
  companion.style.top = reducedBox.checked ? '0px' : (4 * (1 - gap)) + 'px';
}
function frame(now) {
  const dt = Math.min(0.032, (now - last) / 1000);
  last = now;
  const reduced = reducedBox.checked;
  let targetW = 168, targetH = 28, spring = 'calm';
  if (scene === 'ears' && open) { targetW = 420; targetH = 120; spring = 'expand'; }
  if (scene === 'split') { targetW = 168; spring = 'expand'; }
  if (scene === 'level') { targetW = 210; targetH = 36; spring = levelHold > 0 ? 'pop' : 'calm'; }
  if (scene === 'content') { targetW = open ? 280 : 28; targetH = open ? 64 : 28; spring = 'bloom'; }
  if (reduced && scene !== 'ears') {
    shape.w = targetW; shape.h = targetH; shape.v = 0; shape.hv = 0;
  } else {
    [shape.w, shape.v] = springTo(shape.w, shape.v, targetW, spring, dt);
    [shape.h, shape.hv] = springTo(shape.h, shape.hv, targetH, spring, dt);
  }
  const progress = targetW === 28 ? 1 : Math.min(1, Math.abs(shape.w - 28) / Math.abs(targetW - 28));
  const contentTarget = scene === 'content' ? (progress >= 0.4 && open ? 1 : 0) : 1;
  contentIn += ((reduced ? (open || scene !== 'content' ? 1 : 0) : contentTarget) - contentIn) * Math.min(1, dt / 0.18);
  const splitTarget = scene === 'split' && open ? 1 : 0;
  if (reduced) { split = splitTarget; comp.o = splitTarget; comp.v = 0; comp.x = 0; }
  else {
    const before = split;
    [split, comp.v] = springTo(split, comp.v, splitTarget, 'expand', dt);
    comp.o += ((splitTarget - comp.o) * Math.min(1, dt / (splitTarget ? 0.18 : 0.10)));
    if (Math.sign(splitTarget - before) !== Math.sign(splitTarget - split) && splitTarget !== before) {
      /* 半路改目标：速度留在 comp.v 里，不清掉。 */
    }
  }
  if (scene === 'level') levelHold = Math.max(0, levelHold - dt);
  tokenEl.textContent = reduced ? 'reduced' : scenes[scene][2];
  render();
  requestAnimationFrame(frame);
}
document.querySelectorAll('[data-scene]').forEach(button => {
  button.addEventListener('click', () => {
    scene = button.dataset.scene;
    open = scene === 'split' || scene === 'content';
    document.querySelectorAll('[data-scene]').forEach(other => other.setAttribute('aria-pressed', other === button ? 'true' : 'false'));
    title.textContent = scenes[scene][0];
    copy.textContent = scenes[scene][1];
  });
});
document.getElementById('stage').addEventListener('click', () => {
  if (scene === 'level') return;
  open = !open;
  if (scene === 'ears') tokenEl.textContent = open ? 'expand' : 'calm';
});
window.addEventListener('keydown', event => {
  if (scene !== 'level') return;
  if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
    event.preventDefault();
    level = Math.min(1, Math.max(0, level + (event.key === 'ArrowUp' ? 0.08 : -0.08)));
    levelHold = 1.2;
    open = true;
  }
});
requestAnimationFrame(frame);
</script>
</body>
</html>
