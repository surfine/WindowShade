<!doctype html>
<html><head><meta charset="utf-8"><title>MenuBarCapsule</title>
<style>
body{margin:0;background:var(--window-bg);font-family:var(--font-sf);}
.bar{position:relative;height:24px;border-bottom:1px solid var(--separator);}
.menu{position:absolute;top:4px;font-size:13px;color:var(--label);}
.cap{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:80px;height:18px;border-radius:9px;background:var(--notch-fill);}
.slot{position:absolute;left:50%;top:0;transform:translateX(-50%);width:190px;height:24px;outline:1px dashed var(--label-tertiary);}
p{margin:20px 16px 0;font-size:12px;color:var(--label-secondary)}
</style></head><body>
<div class="bar"><span class="menu" style="left:16px"> 訪達　文件</span><div class="slot" aria-hidden="true"></div><div class="cap" aria-label="劉海那一排"></div><span class="menu" style="right:16px">10:42</span></div>
<p>實心是膠囊（80 寬）；虛線是 190 寬的瞄準槽位，只是點擊範圍，不畫出來。</p>
</body></html>
