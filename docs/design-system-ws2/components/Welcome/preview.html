<!-- @dsCard group="首啟引導" height=380 subtitle="第一步：雙擊標題欄收起" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Welcome</title>
<style>
body{margin:0;background:var(--window-bg);font-family:var(--font-sf);color:var(--label);padding:16px}
.win{max-width:560px;margin:0 auto;border-radius:13px;background:var(--window-bg);border:0.5px solid var(--separator);box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden}
.stage{margin:16px;height:150px;border-radius:12px 12px 0 0;background:#2b3a4a;position:relative;overflow:hidden}
.notch{position:absolute;left:50%;top:0;transform:translateX(-50%);width:10.8%;aspect-ratio:1/0.18;background:#000;border-radius:0 0 4px 4px}
.strip{position:absolute;left:58%;top:40px;width:34%;height:14px;border-radius:5px;background:#e9e9ec;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mini{position:absolute;left:8%;top:30px;width:40%;height:90px;border-radius:6px;background:#f5f5f7}
.text{padding:4px 24px 0}
.eye{font-size:12px;line-height:15px;color:var(--label-secondary);margin:0}
h1{font-size:22px;line-height:26px;font-weight:600;margin:4px 0 6px;text-wrap:balance}
.lede{font-size:15px;line-height:20px;margin:0;color:var(--label)}
.status{font-size:13px;line-height:16px;margin:10px 0 0;color:var(--label-secondary)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.dots{display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--label-tertiary)}.dots i.on{background:var(--label)}
.btns{display:flex;gap:8px}
button{font:inherit;font-size:13px;border-radius:6px;padding:4px 14px;border:0.5px solid var(--separator);background:var(--window-bg);color:var(--label)}
button.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
</style></head><body>
<div class="win">
 <div class="stage" aria-hidden="true"><div class="notch"></div><div class="mini"></div><div class="strip"></div></div>
 <div class="text">
  <p class="eye">歡迎使用 WindowShade</p>
  <h1>雙擊標題欄，把窗口收起來。</h1>
  <p class="lede">窗口收成一條卷帘條，裡面的東西都還在。</p>
  <p class="status">✓ 就這樣。別的窗口也一樣。</p>
 </div>
 <div class="bar"><div class="dots" aria-label="第 1 步，共 3 步"><i class="on"></i><i></i><i></i></div><div class="btns"><button>跳過</button><button class="pri">繼續</button></div></div>
</div>
</body></html>
