<!-- @dsCard group="劉海" height=150 subtitle="未對準 · 已對準" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>DropIsland</title>
<style>
body{margin:0;background:var(--window-bg);font-family:var(--font-sf);display:flex;gap:24px;padding:0 16px;flex-wrap:wrap}
.isl{width:340px;max-width:100%;height:84px;background:var(--notch-fill);border-radius:0 0 22px 22px;box-sizing:border-box;border:1px solid var(--notch-stroke);border-top:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;color:var(--notch-text-secondary);font-size:12px;font-weight:500}
.on{border:2px solid var(--accent);border-top:0;color:var(--notch-text)}
figure{margin:0}figcaption{font-size:11px;color:var(--label-secondary);margin-top:6px}
</style></head><body>
<figure><div class="isl">放進來就收好</div><figcaption>未對準：1 pt notch-stroke</figcaption></figure>
<figure><div class="isl on">松手收進劉海</div><figcaption>已對準：2 pt accent，不加灰填充</figcaption></figure>
</body></html>
