name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            git fetch --tags --force
            git checkout "$TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset=WindowShade-${TAG}.zip" >> "$GITHUB_OUTPUT"

      - name: Build WindowShade.app
        working-directory: prototype
        run: ./build.sh

      - name: Package app
        working-directory: prototype
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          ditto -c -k --keepParent WindowShade.app "../dist/${{ steps.release.outputs.asset }}"
          shasum -a 256 "../dist/${{ steps.release.outputs.asset }}" > "../dist/${{ steps.release.outputs.asset }}.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" \
              --title "WindowShade $TAG" \
              --notes "Unsigned macOS build. Download the zip, unzip it, and open WindowShade.app."
          fi
