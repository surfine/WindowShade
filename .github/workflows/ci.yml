# 手动保留的编译检查。托管 runner 目前不可用（账户原因），因此不再在 push / pull_request 上自动运行，
# 避免每次推送都出现与代码无关的红。日常门禁用本地脚本：
#   scripts/local-gate.sh check   # 写证据到 .build/gate/
# 这份 workflow 只在有可用 runner 时手动跑一次，作为“干净环境 + 另一台机器”的交叉验证。
# 不签名、不发布；Sparkle.framework 在 prototype/Vendor 里，checkout 就能编。
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          xcodebuild -version
          swift --version
          # Local development uses Xcode 27 / Swift 6.4. If the runner is older, the log above says so.

      - name: Sparkle is present
        run: test -f prototype/Vendor/Sparkle.framework/Versions/B/Sparkle

      - name: build.sh --check (arm64)
        working-directory: prototype
        run: ./build.sh --check

      # 岛的快速回归：令牌、六态、活动映射、形变接力。
      - name: island motion and geometry
        run: |
          bash tests/run-notch-token-tests.sh
          bash tests/run-island-motion-state-tests.sh
          bash tests/run-notch-activity-motion-tests.sh
          bash tests/run-island-transition-tests.sh

      # 2026-11-04 起支持交叉编译 Intel 包（Diagnostics 采样器已加 arch 分支）；
      # 1.0.21 起 Intel 包随版发布，这一步保证 x86_64 路径不烂掉。
      - name: build.sh --check (x86_64 cross)
        working-directory: prototype
        run: WINDOWSHADE_ARCH=x86_64 ./build.sh --check
